[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-financial-data-warehouse-risk-monitor"
version = "0.1.0"
description = "Incremental SEC EDGAR financial-data warehouse and risk monitor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Krishna Sanjay"}]
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0,<7",
  "tenacity>=9.0,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]

[project.scripts]
sec-risk = "sec_risk_monitor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sec_risk_monitor --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

